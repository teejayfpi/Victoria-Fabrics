name: fabric_haven
description: "Victoria Fabrics - Nigerian fabric store app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

flutter_native_splash:
  # Matches AppColors.heroGradient's mid emerald so the native splash hands off
  # to the animated in-app splash without a visible colour jump.
  color: "#0A6847"
  image: assets/images/splash_logo.png
  android: true
  ios: true
  android_12:
    color: "#0A6847"
    image: assets/images/splash_logo.png
  web: false

# Regenerate with: dart run flutter_launcher_icons
# One brand, two installs: the admin build swaps the accent to terracotta so
# staff can tell the apps apart on the home screen.
flutter_launcher_icons:
  image_path: assets/icon/icon_customer.png
  android: true
  ios: false
  adaptive_icon_background: "#0A6847"
  adaptive_icon_foreground: assets/icon/icon_customer_foreground.png
  adaptive_icon_foreground_inset: 18
  remove_alpha_ios: true

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  cached_network_image: ^3.3.1
  # Used for the inline-image fallback when Firebase Storage is unavailable.
  image: ^4.1.7
  intl: ^0.19.0
  uuid: ^4.4.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3
  firebase_storage: ^12.3.4
  google_sign_in: ^6.2.1

  # Media
  image_picker: ^1.1.2

  # Opens the payment WhatsApp chat / dialer from checkout
  url_launcher: ^6.3.1

  # Notifications
  flutter_local_notifications: ^18.0.1
  flutter_native_splash: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts: []
