name: fabric_haven
description: "Victoria Fabrics - Nigerian fabric store app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/splash.jpg
  android: true
  ios: true
  web: false

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  uuid: ^4.4.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  google_sign_in: ^6.2.1

  # Media
  image_picker: ^1.1.2

  # Notifications
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts: []
