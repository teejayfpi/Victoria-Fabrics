name: Deploy Firebase Rules

# Keeps the *deployed* security rules in step with `main`. Editing
# `firestore.rules` in the repo does nothing until it is deployed — the live
# project keeps running the last deployed version. That drift is what made a
# correctly-fixed roster admin keep getting `permission-denied`.
#
# Authentication, in order of preference:
#   1. FIREBASE_SERVICE_ACCOUNT — the full JSON of a service-account key. This
#      is what Firebase recommends; FIREBASE_TOKEN is deprecated.
#   2. FIREBASE_TOKEN — a legacy `firebase login:ci` token.
# With neither set the job skips with a warning instead of failing, so it never
# blocks the pipeline. See docs/admin-setup.md for how to create either.

on:
  push:
    branches: [ main ]
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - '.github/workflows/deploy-rules.yml'
  workflow_dispatch:

jobs:
  deploy-rules:
    name: Deploy rules
    runs-on: ubuntu-latest
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      CI: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        # firebase-tools 15 refuses to run below JDK 21.
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service-account key
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Warn when no credential is configured
        if: env.FIREBASE_SERVICE_ACCOUNT == '' && env.FIREBASE_TOKEN == ''
        run: |
          echo "::warning::No FIREBASE_SERVICE_ACCOUNT or FIREBASE_TOKEN secret is set, so the rules were NOT deployed."
          echo "The live project still runs its previous rules until you deploy them."
          echo "See docs/admin-setup.md for how to create a service-account key."

      - name: Deploy Firestore rules and indexes
        if: env.FIREBASE_SERVICE_ACCOUNT != '' || env.FIREBASE_TOKEN != ''
        run: |
          firebase deploy \
            --only firestore:rules,firestore:indexes \
            --project victoria-fabrics

      - name: Deploy Storage rules (best-effort)
        # Storage is billing-gated, so the bucket may not exist on a free
        # project. A failure here must not stop the Firestore rules, which are
        # what the admin portal actually depends on.
        if: env.FIREBASE_SERVICE_ACCOUNT != '' || env.FIREBASE_TOKEN != ''
        continue-on-error: true
        run: |
          firebase deploy \
            --only storage \
            --project victoria-fabrics

      - name: Remove service-account key
        if: always() && env.FIREBASE_SERVICE_ACCOUNT != ''
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
