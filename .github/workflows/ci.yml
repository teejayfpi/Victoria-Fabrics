name: Flutter CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint & Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --fatal-infos

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          flags: unittests

  functions:
    name: Cloud Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Type-check
        working-directory: functions
        run: npm run lint

  firestore-rules:
    name: Firestore Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        # The Firestore emulator is a JVM process.
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install rules-test dependencies
        working-directory: firestore-rules-tests
        run: npm install

      - name: Run rules tests
        # Guards the access matrix in firestore.rules — notably that an admin
        # provisioned only through admins/{uid} (no custom claim) can read
        # orders/tickets and manage the catalogue.
        working-directory: firestore-rules-tests
        run: npm test

  build-android:
    name: Build ${{ matrix.app }} APK
    runs-on: ubuntu-latest
    needs: [lint, test, firestore-rules]
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer
            target: lib/main.dart
          - app: admin
            target: lib/main_admin.dart
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate splash screen
        run: dart run flutter_native_splash:create

      - name: Build debug APK
        run: flutter build apk --debug --flavor ${{ matrix.app }} --target ${{ matrix.target }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app }}-debug-apk
          path: build/app/outputs/flutter-apk/app-${{ matrix.app }}-debug.apk

  build-android-release:
    name: Build ${{ matrix.app }} Release APK
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer
            target: lib/main.dart
          - app: admin
            target: lib/main_admin.dart
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate splash screen
        run: dart run flutter_native_splash:create

      - name: Build release APK
        run: flutter build apk --release --flavor ${{ matrix.app }} --target ${{ matrix.target }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app }}-release-apk
          path: build/app/outputs/flutter-apk/app-${{ matrix.app }}-release.apk
