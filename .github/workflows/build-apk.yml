name: Build APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─── Customer App ──────────────────────────────────────────────────
  build-customer-app:
    name: Build Customer App APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate splash screen
        run: dart run flutter_native_splash:create

      - name: Build debug APK (customer)
        run: flutter build apk --debug --target lib/main.dart

      - name: Upload customer debug APK
        uses: actions/upload-artifact@v4
        with:
          name: victoria-fabrics-customer-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Build release APK (customer)
        run: flutter build apk --release --target lib/main.dart

      - name: Upload customer release APK
        uses: actions/upload-artifact@v4
        with:
          name: victoria-fabrics-customer-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ─── Admin App ─────────────────────────────────────────────────────
  build-admin-app:
    name: Build Admin App APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate splash screen
        run: dart run flutter_native_splash:create

      - name: Build debug APK (admin)
        run: flutter build apk --debug --target lib/main_admin.dart

      - name: Upload admin debug APK
        uses: actions/upload-artifact@v4
        with:
          name: victoria-fabrics-admin-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Build release APK (admin)
        run: flutter build apk --release --target lib/main_admin.dart

      - name: Upload admin release APK
        uses: actions/upload-artifact@v4
        with:
          name: victoria-fabrics-admin-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
