include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    avoid_print: error
  exclude:
    - build/**
    - android/**
    # Firebase CLI installs Dart function templates under here; they are not
    # part of this app and reference packages the app does not depend on.
    - firestore-rules-tests/node_modules/**

linter:
  rules:
    avoid_print: true
    prefer_final_locals: true
    always_declare_return_types: true
    unawaited_futures: true
    avoid_empty_else: true
    unnecessary_lambdas: true
    use_super_parameters: true
