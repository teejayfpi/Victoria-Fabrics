import java.util.Properties

plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

// Load release signing material from android/key.properties when present.
// The file (and the keystore it points to) is git-ignored; CI injects it from
// secrets. When absent we fall back to debug signing so local builds work.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.fabrichaven.fabric_haven"
    // 35 is the minimum required by flutter_plugin_android_lifecycle. The
    // platform is backward compatible, so compiling higher is safe.
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        // Required by flutter_local_notifications (java.time backport).
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        // Base id; the product flavors below override it so the customer and
        // admin builds install side by side on the same device.
        applicationId = "com.fabrichaven.fabric_haven"
        minSdkVersion = flutter.minSdkVersion  // Required for Firebase
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // AGP 9 gates flavor-level resValue behind this feature flag.
    buildFeatures {
        resValues = true
    }

    // Two apps from one codebase. Without distinct applicationIds Android
    // treats them as the same package and prompts to *update* instead of
    // install.
    flavorDimensions += "app"
    productFlavors {
        customer {
            dimension = "app"
            applicationId = "com.fabrichaven.fabric_haven"
            resValue "string", "app_name", "Victoria Fabrics"
        }
        admin {
            dimension = "app"
            applicationId = "com.fabrichaven.fabric_haven_admin"
            resValue "string", "app_name", "VF Admin"
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = hasReleaseSigning ? signingConfigs.release : signingConfigs.debug

            // Shrink and obfuscate the release build.
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}

flutter {
    source = "../.."
}
